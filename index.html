<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pink Player — Mini for YouTube Music</title>
  <meta name="description" content="Beautiful mini player for YouTube Music. Adaptive color, synced lyrics, queue, sleep timer." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff4d96'/%3E%3Cpath d='M25 19 L25 45 L47 32 Z' fill='white'/%3E%3C/svg%3E" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 80px 24px 60px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      letter-spacing: -0.01em;
      color: #f3f3f5;
      background: #0a0a0c;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ambient {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(60% 50% at 50% 0%, rgba(255,77,150,0.18), transparent 70%);
    }
    .wrap {
      position: relative;
      z-index: 1;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 112px;
      height: 112px;
      margin: 0 auto 24px;
      filter: drop-shadow(0 12px 30px rgba(255,77,150,0.35));
    }
    h1 {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0 0 8px;
    }
    .tag {
      font-size: 16px;
      color: rgba(243,243,245,0.65);
      margin: 0 0 12px;
    }
    .desc {
      font-size: 14px;
      color: rgba(243,243,245,0.55);
      margin: 0 0 36px;
      line-height: 1.6;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-decoration: none;
      transition: transform 120ms ease, background-color 160ms ease, opacity 160ms ease;
    }
    .btn-primary { background: #ff4d96; color: #fff; }
    .btn-primary:hover { transform: scale(1.03); }
    .btn-ghost {
      background: rgba(255,255,255,0.06);
      color: #f3f3f5;
      outline: 0.5px solid rgba(255,255,255,0.12);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.10); }
    .small {
      margin-top: 40px;
      color: rgba(243,243,245,0.4);
      font-size: 11.5px;
    }
    .small a { color: rgba(243,243,245,0.55); text-decoration: none; }
    .small a:hover { color: #f3f3f5; }
  </style>
</head>
<body>
  <div class="ambient"></div>
  <div class="wrap">
    <svg class="icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="30" fill="#ff4d96"/>
      <circle cx="32" cy="32" r="30" fill="none" stroke="rgba(0,0,0,0.14)" stroke-width="0.6"/>
      <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>
      <path d="M25 19 L25 45 L47 32 Z" fill="#fff"/>
    </svg>
    <h1>Pink Player</h1>
    <p class="tag">Mini Player for YouTube Music</p>
    <p class="desc">
      A beautiful Chrome toolbar mini player. Adaptive color from album art, synced lyrics, queue, sleep timer, keyboard shortcuts. No tracking, no ads.
    </p>
    <div class="actions">
      <a class="btn btn-ghost" href="privacy.html">Privacy</a>
    </div>
    <p class="small">
      Unofficial third-party tool. Not affiliated with or endorsed by YouTube or Google.
    </p>
  </div>
</body>
</html>
