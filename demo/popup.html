<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pink Player</title>
    <meta name="robots" content="noindex" />
    <!-- The extension's own popup.html, popup.css, popup.js and lyrics.js, unchanged
         (release 0.4.1), with demo.js standing in for chrome.* and YouTube Music. -->
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="state-loading" tabindex="-1">
    <div class="ambient" aria-hidden="true"></div>
    <div class="ambient-tint" aria-hidden="true"></div>

    <main class="player">
      <!-- Full transport. Folds away while searching. -->
      <section class="transport" aria-label="Now playing">
        <div class="transport-inner">
          <header class="head">
            <button class="art-wrap" id="art-btn" type="button" aria-label="Open the YouTube Music tab" title="Open YouTube Music">
              <img class="art" alt="" crossorigin="anonymous" />
              <span class="art-fallback" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg>
              </span>
              <span class="art-hover" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
              </span>
            </button>
            <div class="meta">
              <div class="title-wrap"><span class="title" title=""></span></div>
              <button class="artist-link" id="artist-btn" type="button">
                <span class="artist"></span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
              </button>
            </div>
            <button class="btn-like" data-cmd="toggleLike" type="button" aria-label="Like" aria-pressed="false" title="Like  (L)">
              <svg class="ico-heart-outline" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"/></svg>
              <svg class="ico-heart-filled" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </button>
          </header>

          <div class="scrubber" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" tabindex="0">
            <span class="time-pos">0:00</span>
            <div class="scrubber-track">
              <div class="scrubber-fill"></div>
              <div class="scrubber-thumb"></div>
            </div>
            <span class="time-dur">0:00</span>
          </div>

          <div class="controls">
            <button class="btn-toggle btn-shuffle" data-cmd="toggleShuffle" type="button" aria-label="Shuffle" aria-pressed="false" title="Shuffle  (S)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
            </button>
            <button class="btn-icon" data-cmd="previous" type="button" aria-label="Previous" title="Previous  (←)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg>
            </button>
            <button class="btn-play" data-cmd="playPause" type="button" aria-label="Play / Pause" title="Play / Pause  (Space)">
              <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
              <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
            </button>
            <button class="btn-icon" data-cmd="next" type="button" aria-label="Next" title="Next  (→)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/></svg>
            </button>
            <button class="btn-toggle btn-repeat" data-cmd="toggleRepeat" type="button" aria-label="Repeat off" aria-pressed="false" title="Repeat  (R)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
              <span class="repeat-one" aria-hidden="true">1</span>
            </button>
          </div>

          <div class="utility">
            <button class="btn-mini" id="vol-btn" type="button" aria-label="Mute / unmute" title="Mute  (M)">
              <svg class="ico-vol-up" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05a4.5 4.5 0 0 0 2.5-4.02zM14 3.23v2.06A8 8 0 0 1 19 12a8 8 0 0 1-5 7.42v2.1A10 10 0 0 0 22 12 10 10 0 0 0 14 3.23z"/></svg>
              <svg class="ico-vol-mid" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05a4.5 4.5 0 0 0 2.5-4.02z"/></svg>
              <svg class="ico-vol-mute" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.63 3.63a1 1 0 0 0 0 1.41L7.29 8.7 7 9H3v6h4l5 5v-6.59l4.18 4.18c-.49.37-1.02.69-1.61.92v2.06a8.96 8.96 0 0 0 3.06-1.51l1.95 1.95a1 1 0 0 0 1.41-1.41L5.05 3.63a1 1 0 0 0-1.42 0zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.96 8.96 0 0 0 21 12c0-4.28-3-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM12 4L9.91 6.09 12 8.18V4zm4.5 8A4.5 4.5 0 0 0 14 7.97v1.79l2.48 2.48c.01-.08.02-.16.02-.24z"/></svg>
            </button>
            <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1" aria-label="Volume" title="Volume  (↑ ↓)" />
            <div class="sleep">
              <button class="btn-mini sleep-btn" id="sleep-btn" type="button" aria-label="Sleep timer" aria-haspopup="menu" aria-expanded="false" title="Sleep timer">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13.5A8.5 8.5 0 1 1 10.5 3.5 6.5 6.5 0 0 0 20.5 13.5z"/></svg>
                <span class="sleep-label" id="sleep-label"></span>
              </button>
              <div class="sleep-menu" id="sleep-menu" role="menu" aria-label="Sleep timer">
                <span class="menu-heading">Pause after</span>
                <button class="sleep-item" type="button" role="menuitemradio" aria-checked="false" data-sleep="15"><span>15 minutes</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></button>
                <button class="sleep-item" type="button" role="menuitemradio" aria-checked="false" data-sleep="30"><span>30 minutes</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></button>
                <button class="sleep-item" type="button" role="menuitemradio" aria-checked="false" data-sleep="60"><span>1 hour</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></button>
                <button class="sleep-item" type="button" role="menuitemradio" aria-checked="false" data-sleep="track"><span>End of this song</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></button>
                <div class="menu-divider sleep-off-part" aria-hidden="true"></div>
                <button class="sleep-item sleep-off sleep-off-part" type="button" role="menuitem" data-sleep="cancel"><span>Turn off timer</span></button>
              </div>
            </div>
            <button class="btn-mini" id="shortcuts-btn" type="button" aria-label="Keyboard shortcuts" title="Keyboard shortcuts  (?)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 2H5v-2h2v2zm0-3H5V8h2v2zm9 7H8v-2h8v2zm0-4h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/></svg>
            </button>
            <button class="btn-mini" id="popout-btn" type="button" aria-label="Pop out player" title="Pop out player">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
            </button>
          </div>
        </div>
      </section>

      <!-- Slim now-playing strip, shown while searching. -->
      <section class="mini" aria-label="Now playing">
        <div class="mini-inner">
          <button class="mini-main" id="mini-back" type="button" aria-label="Back to player">
            <span class="mini-art"><img class="mini-art-img" alt="" /></span>
            <span class="mini-meta">
              <span class="mini-title"></span>
              <span class="mini-artist"></span>
            </span>
          </button>
          <button class="mini-play" data-cmd="playPause" type="button" aria-label="Play / Pause">
            <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </button>
        </div>
      </section>

      <!-- Why a command didn't take effect (blocked autoplay, unreachable tab) -->
      <div class="notice" id="notice" role="status" hidden>
        <div class="notice-text">
          <span class="notice-title"></span>
          <span class="notice-body"></span>
        </div>
        <button class="btn-secondary notice-action" id="notice-action" type="button"></button>
      </div>

      <section class="panel">
        <div class="panel-tabs" role="tablist">
          <button class="tab is-active" data-tab="queue" type="button" role="tab" aria-selected="true" title="Up Next  (1)"><span>Up Next</span></button>
          <button class="tab" data-tab="lyrics" type="button" role="tab" aria-selected="false" title="Lyrics  (2)"><span>Lyrics</span></button>
          <button class="tab" data-tab="playlists" type="button" role="tab" aria-selected="false" title="Playlists  (3)">
            <svg class="tab-lock" viewBox="0 0 24 24" role="img" aria-label="Pro"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            <span>Playlists</span>
          </button>
          <button class="tab-search" id="search-open" type="button" aria-label="Search YouTube Music" title="Search  ( / )">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          </button>
        </div>

        <div class="search-bar">
          <div class="search-field">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input id="search-input" type="text" placeholder="Search songs, artists, albums" aria-label="Search YouTube Music" autocomplete="off" spellcheck="false" enterkeyhint="search" />
            <button class="search-clear" id="search-clear" type="button" aria-label="Clear search" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
          </div>
          <button class="search-cancel" id="search-cancel" type="button">Cancel</button>
        </div>

        <div class="chips-row" id="chips-row" hidden></div>
        <div class="search-progress" id="search-progress" aria-hidden="true" hidden><span></span></div>

        <div class="panel-body">
          <div class="tab-view queue-view is-active" data-view="queue"></div>
          <div class="tab-view lyrics-view" data-view="lyrics">
            <div class="lyrics-empty">No lyrics found</div>
            <div class="lyrics-lines"></div>
            <div class="lyrics-source" hidden><span class="dot" aria-hidden="true"></span><span>Synced lyrics · LRCLIB</span></div>
          </div>
          <div class="tab-view playlists-view" data-view="playlists"></div>
          <div class="tab-view search-view" data-view="search" aria-label="Search results"></div>
          <span class="scroll-thumb" aria-hidden="true"></span>
        </div>

        <div class="hint-bar" id="hint-bar" aria-hidden="true" hidden></div>
      </section>
    </main>

    <!-- Keyboard shortcuts sheet -->
    <button class="sheet-backdrop" id="sheet-backdrop" type="button" aria-label="Close shortcuts" hidden></button>
    <div class="sheet" id="sheet" role="dialog" aria-label="Keyboard shortcuts" hidden>
      <span class="sheet-grabber" aria-hidden="true"></span>
      <div class="sheet-head">
        <span class="sheet-title">Keyboard shortcuts</span>
        <button class="sheet-close" id="sheet-close" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="sheet-rows" id="sheet-rows"></div>
    </div>

    <output class="toast" id="toast" hidden></output>

    <section class="empty">
      <div class="empty-art">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg>
      </div>
      <p class="empty-msg" id="empty-msg">Connecting to YouTube Music...</p>
      <p class="empty-hint" id="empty-hint">If YouTube Music is already open, reload that tab or allow Pink Player on music.youtube.com.</p>
      <div class="empty-actions">
        <button class="btn-primary" id="reload-ytm" type="button" hidden>Reload YouTube Music</button>
        <button class="btn-primary" id="open-ytm" type="button">Open YouTube Music</button>
        <button class="btn-secondary" id="retry-ytm" type="button">Retry</button>
      </div>
    </section>

    <section class="loading">
      <div class="spinner" aria-hidden="true"></div>
    </section>

    <script src="demo.js"></script>
    <script src="lyrics.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
